<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>India District Map Tool</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pptxgenjs@3.12.0/dist/pptxgen.bundle.js"></script>
<script src="https://cdn.jsdelivr.net/npm/docx@8.5.0/build/index.js"></script>
<script src="india-map-paths.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;font:14px/1.4 system-ui,Arial,sans-serif;height:100vh;display:grid;grid-template-columns:360px 1fr;grid-template-rows:52px 1fr;color:#0f172a;background:#f1f5f9}
header{grid-column:1/-1;background:#fff;border-bottom:1px solid #e2e8f0;display:flex;align-items:center;gap:12px;padding:0 16px}
header h1{font-size:16px;margin:0;flex:1}button{font:inherit;padding:6px 12px;border:1px solid #cbd5e1;background:#fff;border-radius:6px;cursor:pointer}
button.p{background:#2563eb;color:#fff;border-color:#2563eb}button:disabled{opacity:.5}
aside{background:#fff;border-right:1px solid #e2e8f0;display:flex;flex-direction:column;min-height:0}
#q0{margin:10px;padding:8px;border:1px solid #cbd5e1;border-radius:6px}
#list{flex:1;overflow:auto;padding:0 10px}.st{display:flex;gap:6px;align-items:center;padding:5px 0;border-bottom:1px solid #f1f5f9}
.nm{flex:1;cursor:pointer;font-weight:600}.nm i{font-style:normal;font-weight:400;color:#64748b;font-size:12px}
.ds{padding:2px 0 6px 24px;display:grid;grid-template-columns:1fr 1fr;gap:2px 8px}.ds label{font-size:13px}.muted{color:#64748b}
#exp{border-top:1px solid #e2e8f0;padding:10px;display:grid;grid-template-columns:1fr 1fr;gap:6px 8px;font-size:12px;background:#f8fafc}
#exp label{display:flex;flex-direction:column;gap:2px;color:#475569}#exp .w{grid-column:1/-1}#exp input,#exp select{padding:4px;font:inherit}
#exp .c{flex-direction:row;align-items:center;gap:5px}
main{position:relative;min-height:0;display:flex;flex-direction:column}
.bar{display:flex;gap:6px;padding:8px 12px;align-items:center}.bar span{flex:1;color:#475569}
.tab.on{background:#0f172a;color:#fff}
#mapw,#prev{flex:1;min-height:0;margin:0 12px 12px;background:#fff;border:1px solid #e2e8f0;border-radius:8px;overflow:hidden}
#prev{display:none;padding:10px;background:#cbd5e1}#svg{width:100%;height:100%;touch-action:none;cursor:grab}
#svg path{fill:#e8ecf1;stroke:#fff;stroke-width:.5;vector-effect:non-scaling-stroke;cursor:pointer}
#svg path.on{stroke:#222;stroke-width:1.2}#svg path:hover{opacity:.75}
</style></head><body>
<header><h1>India District Map Tool</h1><button onclick="S.clear();sync()">Clear all</button></header>
<aside>
 <input id="q0" placeholder="Search state or district…" oninput="renderList(this.value)">
 <div id="list"></div>
 <div id="exp">
  <label class="w">Title (blank = auto)<input id="title" placeholder="e.g. Marathwada Region, Maharashtra"></label>
  <label class="c"><input type="checkbox" id="dOn" checked> Dealer Name line</label><label><input id="dName" placeholder="Dealer name (optional)"></label>
  <label>Format<select id="fmt"><option value="pdf">PDF</option><option value="png">PNG</option><option value="pptx">PowerPoint</option><option value="docx">Word</option></select></label>
  <label>Page<select id="page"><option value="a4">A4</option><option value="a3">A3</option><option value="letter">Letter</option></select></label>
  <label>Orientation<select id="ori"><option value="l">Landscape</option><option value="p">Portrait</option></select></label>
  <label>Printable margin<select id="mar"><option value="6">Narrow (6 mm)</option><option value="12" selected>Normal (12 mm)</option><option value="20">Wide (20 mm)</option></select></label>
  <label>Quality<select id="q"><option value="1.5">Standard</option><option value="2.5" selected>High</option><option value="4">Max</option></select></label>
  <label>Labels on map<select id="lab"><option value="num">Numbers</option><option value="name">District names</option><option value="none">None</option></select></label>
  <label class="c"><input type="checkbox" id="leg" checked> Legend (colour code)</label>
  <button class="p w" id="go" onclick="doExport()">Export</button>
 </div>
</aside>
<main>
 <div class="bar"><button class="tab on" id="t1" onclick="show(1)">Map</button><button class="tab" id="t2" onclick="show(2)">Export preview</button>
  <span id="cnt"></span><button onclick="zoomSel()">Zoom to selection</button><button onclick="resetVB()">Reset</button></div>
 <div id="mapw"><svg id="svg" viewBox="0 0 860 975"></svg></div><div id="prev"></div>
</main>
<script>
const $=id=>document.getElementById(id),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
// Display-name fixes (state-qualified). Add more here if a name looks old/wrong.
const AL={'Maharashtra|Aurangabad':'Sambhaji Nagar','Maharashtra|Osmanabad':'Dharashiv','Maharashtra|Bid':'Beed','Maharashtra|Garhchiroli':'Gadchiroli','Maharashtra|Gondiya':'Gondia','Maharashtra|Buldana':'Buldhana','Maharashtra|Raigarh':'Raigad'};
const PAL=['#e6194b','#3cb44b','#ffe119','#4363d8','#f58231','#911eb4','#46f0f0','#f032e6','#bcf60c','#fabebe','#008080','#e6beff','#9a6324','#fffac8','#800000','#aaffc3','#808000','#ffd8b1','#000075','#a9a9a9'];
const colorOf=k=>k<PAL.length?PAL[k]:`hsl(${(k*137.5)%360},65%,${52+(k%3)*9}%)`;
const PAGES={a4:[210,297],a3:[297,420],letter:[215.9,279.4]};
const P=window.INDIA_MAP_PATHS,ST=Object.keys(P).sort(),D=[],BY={},S=new Set();
ST.forEach(s=>{BY[s]=[];P[s].s.forEach(sh=>{const n=sh.p.match(/-?\d+\.?\d*/g).map(Number);let a=1e9,b=1e9,c=-1e9,d=-1e9;
 for(let i=0;i<n.length;i+=2){a=Math.min(a,n[i]);c=Math.max(c,n[i]);b=Math.min(b,n[i+1]);d=Math.max(d,n[i+1])}
 const o={id:D.length,st:s,raw:sh.n,name:AL[s+'|'+sh.n]||sh.n,p:sh.p,bb:[a,b,c,d]};D.push(o);BY[s].push(o)})});
// ---------- map ----------
const svg=$('svg');svg.innerHTML=D.map(d=>`<path data-id="${d.id}" d="${d.p}"><title>${esc(d.name)}, ${esc(d.st)}</title></path>`).join('');
const pathEls=[...svg.querySelectorAll('path')];let vb=[0,0,860,975];
const setVB=()=>svg.setAttribute('viewBox',vb.join(' ')),resetVB=()=>{vb=[0,0,860,975];setVB()};
function bboxOf(ids){let a=1e9,b=1e9,c=-1e9,d=-1e9;ids.forEach(i=>{const x=D[i].bb;a=Math.min(a,x[0]);b=Math.min(b,x[1]);c=Math.max(c,x[2]);d=Math.max(d,x[3])});return[a,b,c,d]}
function zoomSel(){if(!S.size)return;const[a,b,c,d]=bboxOf([...S]);vb=[a-15,b-15,c-a+30,d-b+30];setVB()}
const pt=e=>{const p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;return p.matrixTransform(svg.getScreenCTM().inverse())};
svg.addEventListener('wheel',e=>{e.preventDefault();const f=e.deltaY>0?1.15:1/1.15,p=pt(e);vb=[p.x-(p.x-vb[0])*f,p.y-(p.y-vb[1])*f,vb[2]*f,vb[3]*f];setVB()},{passive:false});
let drag=null,moved=0;
svg.addEventListener('pointerdown',e=>{drag=[e.clientX,e.clientY];moved=0});
addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-drag[0],dy=e.clientY-drag[1];moved+=Math.abs(dx)+Math.abs(dy);
 const u=Math.max(vb[2]/svg.clientWidth,vb[3]/svg.clientHeight);vb[0]-=dx*u;vb[1]-=dy*u;drag=[e.clientX,e.clientY];setVB()});
addEventListener('pointerup',()=>drag=null);
svg.addEventListener('click',e=>{if(moved>5)return;const t=e.target.closest('path');if(t)toggle(+t.dataset.id)});
function toggle(id){S.has(id)?S.delete(id):S.add(id);sync()}
// ---------- sidebar ----------
function renderList(q=''){q=q.trim().toLowerCase();let h='';
 ST.forEach(s=>{const sm=s.toLowerCase().includes(q);const m=BY[s].filter(d=>!q||sm||d.name.toLowerCase().includes(q)||d.raw.toLowerCase().includes(q));if(!m.length)return;
  h+=`<div class="st" data-s="${esc(s)}"><input type="checkbox" data-st="${esc(s)}"><span class="nm">${esc(s)} <i></i></span></div><div class="ds" ${q?'':'hidden'}>${m.map(d=>`<label><input type="checkbox" data-d="${d.id}"> ${esc(d.name)}</label>`).join('')}</div>`});
 $('list').innerHTML=h||'<p class="muted">No match</p>';sync()}
$('list').addEventListener('click',e=>{const n=e.target.closest('.nm');if(n){const b=n.parentElement.nextElementSibling;b.hidden=!b.hidden}});
$('list').addEventListener('change',e=>{const t=e.target;
 if(t.dataset.d!==undefined){t.checked?S.add(+t.dataset.d):S.delete(+t.dataset.d)}
 else if(t.dataset.st){BY[t.dataset.st].forEach(d=>t.checked?S.add(d.id):S.delete(d.id))}sync()});
function sync(){
 const ids=[...S],col={};ids.forEach((id,k)=>col[id]=colorOf(k));
 pathEls.forEach((el,id)=>{const on=S.has(id);el.classList.toggle('on',on);on?el.style.fill=col[id]:el.style.removeProperty('fill')});
 document.querySelectorAll('input[data-d]').forEach(i=>i.checked=S.has(+i.dataset.d));
 document.querySelectorAll('.st').forEach(r=>{const s=r.dataset.s,n=BY[s].filter(d=>S.has(d.id)).length,c=r.firstChild;
  c.checked=n===BY[s].length;c.indeterminate=n>0&&n<BY[s].length;r.querySelector('i').textContent=`${n}/${BY[s].length}`});
 const ss=new Set(ids.map(i=>D[i].st));$('cnt').textContent=`${ids.length} district(s) from ${ss.size} state(s) selected`;
 if($('prev').style.display==='block')renderPrev()}
// ---------- export page ----------
const opts=()=>({fmt:$('fmt').value,page:$('page').value,land:$('ori').value==='l',margin:+$('mar').value,q:+$('q').value,title:$('title').value.trim(),
 dealerOn:$('dOn').checked,dealer:$('dName').value.trim(),label:$('lab').value,legend:$('leg').checked});
function pageSVG(o,prev){
 const ids=[...S];if(!ids.length)return null;const k0=96/25.4;let[wm,hm]=PAGES[o.page];if(o.land)[wm,hm]=[hm,wm];
 const pw=Math.round(wm*k0),ph=Math.round(hm*k0),m=o.margin*k0,W=pw-2*m,sts=new Set(ids.map(i=>D[i].st));
 const title=o.title||(sts.size===1?[...sts][0]+' – Districts':'Selected Districts – India');
 let y=m,out=`<text x="${pw/2}" y="${y+22}" text-anchor="middle" font-size="24" font-weight="700">${esc(title)}</text>`;y+=36;
 if(o.dealerOn){out+=`<text x="${m}" y="${y+16}" font-size="15">Dealer Name: ${esc(o.dealer)}</text><line x1="${m+98}" x2="${m+98+Math.max(235,o.dealer.length*9)}" y1="${y+19}" y2="${y+19}" stroke="#333"/>`;y+=28}
 let legH=0,leg='';
 if(o.legend){const rh=ids.length>60?15:20,fs=rh-7,lab=ids.map((id,j)=>`${j+1}. ${D[id].name}${sts.size>1?' ('+D[id].st+')':''}`);
  const cw=Math.max(...lab.map(t=>t.length))*fs*.56+fs+22,cols=Math.max(1,Math.floor(W/cw)),rows=Math.ceil(ids.length/cols);legH=28+rows*rh+6;const ly=ph-m-legH;
  leg=`<text x="${m}" y="${ly+16}" font-size="14" font-weight="700">Colour Code – Districts</text>`+ids.map((id,j)=>{const cx=m+Math.floor(j/rows)*cw,cy=ly+28+(j%rows)*rh;
   return`<rect x="${cx}" y="${cy}" width="${fs}" height="${fs}" fill="${colorOf(j)}" stroke="#333" stroke-width=".8"/><text x="${cx+fs+6}" y="${cy+fs-1}" font-size="${fs}">${esc(lab[j])}</text>`}).join('')}
 const my=y+4,mh=ph-m-legH-(legH?10:0)-my,[x0,y0,x1,y1]=bboxOf(ids),bw=(x1-x0)||1,bh=(y1-y0)||1,kk=Math.min(W/bw,mh/bh)*.97,
  tx=m+(W-bw*kk)/2-x0*kk,ty=my+(mh-bh*kk)/2-y0*kk;
 const paths=`<g transform="translate(${tx},${ty}) scale(${kk})" stroke="#222" stroke-width="${1.2/kk}" stroke-linejoin="round">`+ids.map((id,j)=>`<path d="${D[id].p}" fill="${colorOf(j)}"/>`).join('')+'</g>';
 let lb='';if(o.label!=='none')lb=ids.map((id,j)=>{const b=D[id].bb,cx=tx+(b[0]+b[2])/2*kk,cy=ty+(b[1]+b[3])/2*kk,sz=Math.min((b[2]-b[0])*kk,(b[3]-b[1])*kk),nm=o.label==='name',
  fs=nm?Math.max(8,Math.min(12,sz/4)):Math.max(8,Math.min(14,sz/2));
  return`<text x="${cx}" y="${cy}" dy=".35em" text-anchor="middle" font-size="${fs}" font-weight="700" fill="#111" stroke="#fff" stroke-width="3" paint-order="stroke">${nm?esc(D[id].name):j+1}</text>`}).join('');
 const svgS=`<svg xmlns="http://www.w3.org/2000/svg" ${prev?'':`width="${pw}" height="${ph}"`} viewBox="0 0 ${pw} ${ph}" font-family="Arial,Helvetica,sans-serif"><rect width="${pw}" height="${ph}" fill="#fff"/>${out}${paths}${lb}${leg}</svg>`;
 return{svg:svgS,pw,ph,wm,hm}}
function show(n){$('mapw').style.display=n===1?'':'none';$('prev').style.display=n===2?'block':'none';$('t1').classList.toggle('on',n===1);$('t2').classList.toggle('on',n===2);if(n===2)renderPrev()}
function renderPrev(){const r=pageSVG(opts(),true);$('prev').innerHTML=r?`<div style="height:100%;aspect-ratio:${r.pw}/${r.ph};max-width:100%;margin:auto;background:#fff;box-shadow:0 2px 12px #0004">${r.svg.replace('<svg ','<svg style="width:100%;height:100%" ')}</div>`:'<p class="muted" style="padding:20px">Select districts to preview.</p>'}
$('exp').addEventListener('input',()=>{if($('prev').style.display==='block')renderPrev()});
// ---------- export ----------
const dl=(b,n)=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=n;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),5000)};
const toCanvas=(svgS,pw,ph,sc)=>new Promise((ok,no)=>{const u=URL.createObjectURL(new Blob([svgS],{type:'image/svg+xml'})),im=new Image();
 im.onload=()=>{const c=document.createElement('canvas');c.width=Math.round(pw*sc);c.height=Math.round(ph*sc);const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);ok(c)};
 im.onerror=()=>no(new Error('Render failed (try lower quality)'));im.src=u});
async function doExport(){
 if(!S.size)return alert('Select at least one district first.');const o=opts(),btn=$('go');btn.disabled=true;btn.textContent='Exporting…';
 try{const r=pageSVG(o),c=await toCanvas(r.svg,r.pw,r.ph,o.q),name='district-map';
  if(o.fmt==='png')c.toBlob(b=>dl(b,name+'.png'));
  else if(o.fmt==='pdf'){const pdf=new window.jspdf.jsPDF({orientation:o.land?'l':'p',unit:'mm',format:o.page});
   pdf.addImage(c.toDataURL('image/jpeg',.95),'JPEG',0,0,pdf.internal.pageSize.getWidth(),pdf.internal.pageSize.getHeight());pdf.save(name+'.pdf')}
  else if(o.fmt==='pptx'){const p=new PptxGenJS(),w=r.wm/25.4,h=r.hm/25.4;p.defineLayout({name:'MAP',width:w,height:h});p.layout='MAP';
   p.addSlide().addImage({data:c.toDataURL('image/png'),x:0,y:0,w,h});await p.writeFile({fileName:name+'.pptx'})}
  else{const d=window.docx,b64=c.toDataURL('image/png').split(',')[1],bytes=Uint8Array.from(atob(b64),ch=>ch.charCodeAt(0)),tw=mm=>Math.round(mm/25.4*1440),
   [a,b]=[Math.min(r.wm,r.hm),Math.max(r.wm,r.hm)];
   const doc=new d.Document({sections:[{properties:{page:{size:{width:tw(a),height:tw(b),orientation:o.land?d.PageOrientation.LANDSCAPE:d.PageOrientation.PORTRAIT},margin:{top:0,right:0,bottom:0,left:0}}},
    children:[new d.Paragraph({spacing:{before:0,after:0,line:240},children:[new d.ImageRun({type:'png',data:bytes,transformation:{width:r.pw-4,height:r.ph-14}})]})]}]});
   dl(await d.Packer.toBlob(doc),name+'.docx')}
 }catch(err){alert('Export failed: '+err.message)}
 btn.disabled=false;btn.textContent='Export'}
renderList();
</script></body></html>
