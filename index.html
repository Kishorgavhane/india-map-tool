<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>India District Map Tool</title>

<style>

header{grid-column:1/-1;background:#fff;border-bottom:1px solid #e2e8f0;display:flex;align-items:center;gap:12px;padding:0 16px}

button.p{background:#2563eb;color:#fff;border-color:#2563eb}button:disabled{opacity:.5}
aside{background:#fff;border-right:1px solid #e2e8f0;display:flex;flex-direction:column;min-height:0}
#q0{margin:10px;padding:8px;border:1px solid #cbd5e1;border-radius:6px}
#list{flex:1;overflow:auto;padding:0 10px}.st{display:flex;gap:6px;align-items:center;padding:5px 0;border-bottom:1px solid #f1f5f9}
.nm{flex:1;cursor:pointer;font-weight:600}.nm i{font-style:normal;font-weight:400;color:#64748b;font-size:12px}
.ds{padding:2px 0 6px 24px;display:grid;grid-template-columns:1fr 1fr;gap:2px 8px}.ds label{font-size:13px}.muted{color:#64748b}
#exp{border-top:1px solid #e2e8f0;padding:10px;display:grid;grid-template-columns:1fr 1fr;gap:6px 8px;font-size:12px;background:#f8fafc}
#exp label{display:flex;flex-direction:column;gap:2px;color:#475569}#exp .w{grid-column:1/-1}#exp input,#exp select{padding:4px;font:inherit}
#exp .c{flex-direction:row;align-items:center;gap:5px}
main{position:relative;min-height:0;display:flex;flex-direction:column}
.bar{display:flex;gap:6px;padding:8px 12px;align-items:center}.bar span{flex:1;color:#475569}
.tab.on{background:#0f172a;color:#fff}
#mapw,#prev{flex:1;min-height:0;margin:0 12px 12px;background:#fff;border:1px solid #e2e8f0;border-radius:8px;overflow:hidden}
#prev{display:none;padding:10px;background:#cbd5e1}#svg{width:100%;height:100%;touch-action:none;cursor:grab}
#svg path{fill:#e8ecf1;stroke:#fff;stroke-width:.5;vector-effect:non-scaling-stroke;cursor:pointer}

.ds[hidden]{display:none}.nm::before{content:"▸ "}.st.open .nm::before{content:"▾ "}.fl{color:#d97706;font-style:normal}#zones{display:flex;flex-wrap:wrap;gap:4px;padding:0 10px 8px}#zones button{padding:3px 8px;font-size:12px}#zones button.on{background:#2563eb;color:#fff;border-color:#2563eb}#exp textarea{padding:4px;font:inherit;resize:vertical}
#svg path.on{stroke:#222;stroke-width:1.2}#svg path:hover{opacity:.75}
</style></head><body>
<header><h1>India District Map Tool</h1><button onclick="S.clear();sync()">Clear all</button></header>
<aside>
 <input id="q0" placeholder="Search state or district…" oninput="renderList(this.value)">
 <div id="zones"></div>
 <div id="list"></div>
 <div id="exp">
  <label class="w">Title (blank = auto)<input id="title" placeholder="e.g. Marathwada Region, Maharashtra"></label>
  <label class="w">Text to print on page (optional, multi-line)<textarea id="note" rows="2" placeholder="e.g. Dealer: ABC Motors, Pune"></textarea></label>
  <label>Format<select id="fmt"><option value="pdf">PDF</option><option value="png">PNG</option><option value="pptx">PowerPoint (editable shapes)</option><option value="pptxi">PowerPoint (picture)</option><option value="docx">Word</option></select></label>
  <label>Page<select id="page"><option value="a4">A4</option><option value="a3">A3</option><option value="letter">Letter</option></select></label>
  <label>Orientation<select id="ori"><option value="a">Auto (best fit)</option><option value="l">Landscape</option><option value="p">Portrait</option></select></label>
  <label>Printable margin<select id="mar"><option value="6">Narrow (6 mm)</option><option value="12" selected>Normal (12 mm)</option><option value="20">Wide (20 mm)</option></select></label>
  <label>Quality<select id="q"><option value="1.5">Standard</option><option value="2.5" selected>High</option><option value="4">Max</option></select></label>
  <label>Labels on map<select id="lab"><option value="name">District names</option><option value="num">Numbers</option><option value="none">None</option></select></label>
  <label class="c"><input type="checkbox" id="leg" checked> Legend (colour code)</label>
  <label>Map size %<input type="range" id="msz" min="40" max="100" value="100"></label>
  <label>Legend text (px)<input type="range" id="lfs" min="8" max="22" value="12"></label>
  <label>Map label size<input type="range" id="mfs" min="6" max="24" value="13"></label>
  <label>Boundary width<input type="range" id="bw" min="0.4" max="3" step="0.2" value="1.2"></label>
  <label>State border<input type="range" id="sbw" min="0" max="4" step="0.2" value="2"></label>
  <label class="w">Legend position<select id="lpos"><option value="auto">Auto (gives bigger map)</option><option value="right">Right side</option><option value="bottom">Bottom</option></select></label>
  <button class="p w" id="go" onclick="doExport()">Export</button>
 </div>
</aside>
<main>
 <div class="bar"><button class="tab on" id="t1" onclick="show(1)">Map</button><button class="tab" id="t2" onclick="show(2)">Export preview</button><button class="tab" id="t3" onclick="show(3)">Customize</button>
  <span id="cnt"></span><button onclick="zoomSel()">Zoom to selection</button><button onclick="resetVB()">Reset</button></div>
 <div id="mapw"><svg id="svg" viewBox="0 0 860 975"></svg></div><div id="prev"></div><div id="cust"></div>
</main>
<script>

 for(let i=0;i<n.length;i+=2){a=Math.min(a,n[i]);c=Math.max(c,n[i]);b=Math.min(b,n[i+1]);d=Math.max(d,n[i+1])}
 const o={id:D.length,st:s,raw:sh.n,name:AL[s+'#'+BY[s].length]||AL[s+'|'+sh.n]||sh.n.trim()||(s+' (unnamed shape)'),p:sh.p,bb:[a,b,c,d]};D.push(o);BY[s].push(o)})});
// ---------- map ----------
const svg=$('svg');svg.innerHTML=D.map(d=>`<path data-id="${d.id}" d="${d.p}"><title>${esc(d.name)}, ${esc(d.st)}</title></path>`).join('');
const pathEls=[...svg.querySelectorAll('path')];let vb=[0,0,860,975];
const setVB=()=>svg.setAttribute('viewBox',vb.join(' ')),resetVB=()=>{vb=[0,0,860,975];setVB()};
function bboxOf(ids){let a=1e9,b=1e9,c=-1e9,d=-1e9;ids.forEach(i=>{const x=D[i].bb;a=Math.min(a,x[0]);b=Math.min(b,x[1]);c=Math.max(c,x[2]);d=Math.max(d,x[3])});return[a,b,c,d]}

svg.addEventListener('click',e=>{if(moved>5)return;const t=e.target.closest('path');if(t)toggle(+t.dataset.id)});

// ---------- sidebar ----------
const ZONES={'Northern':['Delhi','Haryana','Himachal Pradesh','Jammu & Kashmir','Ladakh','Punjab','Rajasthan','Chandigarh'],'Central':['Uttar Pradesh','Uttarakhand','Madhya Pradesh','Chhattisgarh'],'Eastern':['Bihar','Jharkhand','Odisha','West Bengal'],'Western':['Gujarat','Maharashtra','Goa','Dadra & Nagar Haveli and Daman & Diu'],'Southern':['Andhra Pradesh','Karnataka','Kerala','Tamil Nadu','Telangana','Puducherry','Lakshadweep','Andaman & Nicobar Islands'],'North Eastern':['Assam','Arunachal Pradesh','Manipur','Meghalaya','Mizoram','Nagaland','Tripura','Sikkim']},ZONE={};let ZF=null;
Object.entries(ZONES).forEach(([z,a])=>a.forEach(s=>ZONE[s]=z));
function zoneClick(z){ZF=z||null;if(z){const ds=D.filter(d=>ZONE[d.st]===z),all=ds.every(d=>S.has(d.id));ds.forEach(d=>all?S.delete(d.id):S.add(d.id))}

function expAll(v){document.querySelectorAll('#list .ds').forEach(x=>x.hidden=!v);document.querySelectorAll('#list .st').forEach(x=>x.classList.toggle('open',v))}
function renderList(q=''){q=q.trim().toLowerCase();let h='';
 ST.forEach(s=>{if(ZF&&ZONE[s]!==ZF)return;const sm=s.toLowerCase().includes(q);const m=BY[s].filter(d=>!q||sm||d.name.toLowerCase().includes(q)||d.raw.toLowerCase().includes(q));if(!m.length)return;
  h+=`<div class="st${q?' open':''}" data-s="${esc(s)}"><input type="checkbox" data-st="${esc(s)}"><span class="nm">${esc(s)} <i></i></span></div><div class="ds" ${q?'':'hidden'}>${m.map(d=>`<label><input type="checkbox" data-d="${d.id}"> ${esc(d.name)}${d.st==='Rajasthan'&&AB.has(d.name)?' <i class="fl" title="Abolished Dec 2024 (Rajasthan now has 41 districts)">⚠</i>':''}</label>`).join('')}</div>`});
 $('list').innerHTML=h||'<p class="muted">No match</p>';sync()}
$('list').addEventListener('click',e=>{const n=e.target.closest('.nm');if(n){const b=n.parentElement.nextElementSibling;b.hidden=!b.hidden;n.parentElement.classList.toggle('open',!b.hidden)}});
$('list').addEventListener('change',e=>{const t=e.target;
 if(t.dataset.d!==undefined){t.checked?S.add(+t.dataset.d):S.delete(+t.dataset.d)}
 else if(t.dataset.st){BY[t.dataset.st].forEach(d=>t.checked?S.add(d.id):S.delete(d.id))}sync()});
function sync(){
 const ids=[...S],col={};ids.forEach((id,k)=>col[id]=colr(id,k));
 pathEls.forEach((el,id)=>{const on=S.has(id);el.classList.toggle('on',on);on?el.style.fill=col[id]:el.style.removeProperty('fill')});
 document.querySelectorAll('input[data-d]').forEach(i=>i.checked=S.has(+i.dataset.d));
 document.querySelectorAll('.st').forEach(r=>{const s=r.dataset.s,n=BY[s].filter(d=>S.has(d.id)).length,c=r.firstChild;
  c.checked=n===BY[s].length;c.indeterminate=n>0&&n<BY[s].length;r.querySelector('i').textContent=`${n}/${BY[s].length}`});
 const ss=new Set(ids.map(i=>D[i].st));$('cnt').textContent=`${ids.length} district(s) from ${ss.size} state(s) selected`;
 if($('prev').style.display==='block')renderPrev()}
// ---------- export page ----------
const opts=()=>({fmt:$('fmt').value,page:$('page').value,ori:$('ori').value,sbw:+$('sbw').value,margin:+$('mar').value,q:+$('q').value,title:$('title').value.trim(),
 note:$('note').value.replace(/\s+$/,''),label:$('lab').value,legend:$('leg').checked,msz:+$('msz').value,lfs:+$('lfs').value,mfs:+$('mfs').value,bw:+$('bw').value,lpos:$('lpos').value});
const CU={},colr=(id,j)=>CU[id]&&CU[id].c||colorOf(j),nameOf=id=>CU[id]&&CU[id].n||D[id].name,
 hex=c=>{const x=document.createElement('canvas').getContext('2d');x.fillStyle=c;return x.fillStyle};
const sp=t=>{const w=t.split(' ');if(w.length<2)return[t];let b=1,bd=1e9;for(let i=1;i<w.length;i++){const d=Math.abs(w.slice(0,i).join(' ').length-t.length/2);if(d<bd){bd=d;b=i}}return[w.slice(0,b).join(' '),w.slice(b).join(' ')]};
function ringsOf(d){if(d.r)return d.r;const rs=[];d.p.split('Z').forEach(u=>{const n=u.match(/-?\d+\.?\d*/g);if(!n||n.length<6)return;const pts=[];for(let i=0;i<n.length;i+=2)pts.push([+n[i],+n[i+1]]);const st=Math.max(1,Math.floor(pts.length/150));rs.push(pts.filter((_,i)=>i%st===0))});return d.r=rs}
function pole(d){if(d.po)return d.po;const R=ringsOf(d),[a,b,c,e]=d.bb;let best=[(a+c)/2,(b+e)/2,0];
 const dist=(x,y)=>{let ins=false,md=1e18;for(const r of R)for(let i=0,j=r.length-1;i<r.length;j=i++){const[x1,y1]=r[i],[x2,y2]=r[j];if((y1>y)!==(y2>y)&&x<(x2-x1)*(y-y1)/(y2-y1)+x1)ins=!ins;const dx=x2-x1,dy=y2-y1,l=dx*dx+dy*dy,t=l?Math.max(0,Math.min(1,((x-x1)*dx+(y-y1)*dy)/l)):0,px=x1+t*dx-x,py=y1+t*dy-y;md=Math.min(md,px*px+py*py)}return ins?Math.sqrt(md):-Math.sqrt(md)};
 let cx=(a+c)/2,cy=(b+e)/2,w=(c-a)/2,h=(e-b)/2;
 for(let it=0;it<3;it++){let bb=best;for(let i=0;i<=6;i++)for(let j=0;j<=6;j++){const x=cx-w+w*i/3,y=cy-h+h*j/3,v=dist(x,y);if(v>bb[2])bb=[x,y,v]}best=bb;cx=best[0];cy=best[1];w/=3;h/=3}
 return d.po=best}
function layoutLabels(o,ids,kk,tx,ty,pw,ph,ctr){
 const placed=[],res=[],hit=q=>placed.some(a=>q.x<a.x+a.w&&q.x+q.w>a.x&&q.y<a.y+a.h&&q.y+q.h>a.y),
  fitF=(ls,r)=>{for(let f=o.mfs;f>=6;f-=.5)if(Math.hypot(Math.max(...ls.map(l=>l.length))*f*.28,ls.length*f*.575)<=r*1.08)return f;return 0},
  box=(ls,f,cx,cy)=>{const w=Math.max(...ls.map(l=>l.length))*f*.56+2,h=ls.length*f*1.15;return{x:cx-w/2,y:cy-h/2,w,h}};
 ids.map((id,j)=>j).sort((a,b)=>pole(D[ids[b]])[2]-pole(D[ids[a]])[2]).forEach(j=>{
  const id=ids[j],po=pole(D[id]),px=tx+po[0]*kk,py=ty+po[1]*kk,r=po[2]*kk,txt=o.label==='name'?nameOf(id):String(j+1),c1=[txt],c2=sp(txt),
   f1=fitF(c1,r),f2=c2.length>1?fitF(c2,r):0,ls=f2>f1?c2:c1,f=Math.max(f1,f2);let L=null;
  if(f){const b=box(ls,f,px,py);if(!hit(b))L={lines:ls,fs:f,x:px,y:py,b}}
  if(!L){const cl=txt.length>14?c2:c1,fs=Math.max(6.5,Math.min(o.mfs,9)),a0=Math.atan2(py-ctr[1],px-ctr[0]),b0=box(cl,fs,0,0);
   search:for(let d=r+8;d<r+160;d+=12)for(const da of[0,.5,-.5,1,-1,1.6,-1.6,2.4,-2.4,3.14]){const a=a0+da,ext=Math.abs(Math.cos(a))*b0.w/2+Math.abs(Math.sin(a))*b0.h/2,cx=px+Math.cos(a)*(d+ext),cy=py+Math.sin(a)*(d+ext),b=box(cl,fs,cx,cy);
    if(b.x>3&&b.y>3&&b.x+b.w<pw-3&&b.y+b.h<ph-3&&!hit(b)){L={lines:cl,fs,x:cx,y:cy,b,ln:[px,py,cx-Math.cos(a)*ext,cy-Math.sin(a)*ext]};break search}}
   if(!L)L={lines:cl,fs,x:px,y:py,b:box(cl,fs,px,py)}}
  placed.push({x:L.b.x-1,y:L.b.y-1,w:L.b.w+2,h:L.b.h+2});L.nm=nameOf(id);res[j]=L});return res}
function pageSVG(o,prev){
 if(o.ori==='a'&&!o._r){const a=pageSVG({...o,ori:'l',_r:1},prev),b=pageSVG({...o,ori:'p',_r:1},prev);return a&&b?(a.s.kk>=b.s.kk?a:b):null}
 const ids=[...S];if(!ids.length)return null;const k0=96/25.4;let[wm,hm]=PAGES[o.page];if(o.ori==='l')[wm,hm]=[hm,wm];
 const pw=Math.round(wm*k0),ph=Math.round(hm*k0),m=o.margin*k0,sts=new Set(ids.map(i=>D[i].st)),multi=sts.size>1,
  title=o.title||(multi?'Selected Districts – India':[...sts][0]+' – Districts'),nl=o.note?o.note.split('\n').length:0,top=m+36+(nl?nl*20+8:0),aw=pw-2*m,ah=ph-m-top,
  fs=o.lfs,rh=Math.round(fs*1.5),col=ids.map((id,j)=>colr(id,j)),lab=ids.map((id,j)=>`${j+1}. ${nameOf(id)}${multi?' ('+D[id].st+')':''}`),
  cw=Math.max(...lab.map(t=>t.length))*fs*.56+fs+22,[x0,y0,x1,y1]=bboxOf(ids),bw=(x1-x0)||1,bh=(y1-y0)||1;
 const plan=pos=>{if(!o.legend)return{map:{x:m,y:top,w:aw,h:ah},leg:null};
  if(pos==='bottom'){const cols=Math.max(1,Math.floor(aw/cw)),rows=Math.ceil(ids.length/cols),h=28+rows*rh+6;return{map:{x:m,y:top,w:aw,h:ah-h-10},leg:{x:m,y:ph-m-h,rows,w:aw}}}
  const rows=Math.max(1,Math.floor((ah-30)/rh)),cols=Math.ceil(ids.length/rows),w=cols*cw;return{map:{x:m,y:top,w:aw-w-14,h:ah},leg:{x:pw-m-w,y:top,rows,w}}};
 const fit=Q=>Q.map.w>20&&Q.map.h>20?Math.min(Q.map.w/bw,Q.map.h/bh):0;
 let pl=plan(o.lpos==='right'?'right':'bottom');if(o.lpos==='auto'){const a=plan('bottom'),b=plan('right');pl=fit(b)>fit(a)?b:a}
 const kk=Math.max(.01,fit(pl)*.97*o.msz/100),M=pl.map,tx=M.x+(M.w-bw*kk)/2-x0*kk,ty=M.y+(M.h-bh*kk)/2-y0*kk;
 const items=pl.leg?ids.map((id,j)=>({x:pl.leg.x+Math.floor(j/pl.leg.rows)*cw,y:pl.leg.y+28+(j%pl.leg.rows)*rh,t:lab[j],c:col[j]})):[];
 const labels=o.label==='none'?[]:layoutLabels(o,ids,kk,tx,ty,pw,ph,[M.x+M.w/2,M.y+M.h/2]);
 const by={};ids.forEach((id,j)=>(by[D[id].st]=by[D[id].st]||[]).push(j));
 const mp=Object.values(by).map(js=>(o.sbw>0?`<g fill="#000" stroke="#000" stroke-width="${2*o.sbw/kk}" stroke-linejoin="round">${js.map(j=>`<path d="${D[ids[j]].p}"/>`).join('')}</g>`:'')
  +`<g stroke="#222" stroke-width="${o.bw/kk}" stroke-linejoin="round">${js.map(j=>`<path d="${D[ids[j]].p}" fill="${col[j]}"/>`).join('')}</g>`).join('');
 const lb=labels.map(l=>(l.ln?`<line x1="${l.ln[0]}" y1="${l.ln[1]}" x2="${l.ln[2]}" y2="${l.ln[3]}" stroke="#333" stroke-width=".8"/><circle cx="${l.ln[0]}" cy="${l.ln[1]}" r="2.2" fill="#111"/>`:'')
  +l.lines.map((t,i)=>`<text x="${l.x}" y="${l.y+(i-(l.lines.length-1)/2)*l.fs*1.15}" dy=".35em" text-anchor="middle" font-size="${l.fs}" font-weight="700" fill="#111" stroke="#fff" stroke-width="2.5" paint-order="stroke">${esc(t)}</text>`).join('')).join('');
 const bk=pl.leg&&pl.leg.w>340;
 const svgS=`<svg xmlns="http://www.w3.org/2000/svg" ${prev?'':`width="${pw}" height="${ph}"`} viewBox="0 0 ${pw} ${ph}" font-family="Arial,Helvetica,sans-serif"><rect width="${pw}" height="${ph}" fill="#fff"/>`
 +`<text x="${pw/2}" y="${m+22}" text-anchor="middle" font-size="24" font-weight="700">${esc(title)}</text>`
 +(nl?o.note.split('\n').map((t,i)=>`<text x="${pw/2}" y="${m+54+i*20}" text-anchor="middle" font-size="15">${esc(t)}</text>`).join(''):'')
 +`<g transform="translate(${tx},${ty}) scale(${kk})">${mp}</g>`+lb
 +(pl.leg?`<text x="${pl.leg.x}" y="${pl.leg.y+16}" font-size="14" font-weight="700">Colour Code – Districts</text>`+(bk?`<line x1="${pl.leg.x+200}" x2="${pl.leg.x+225}" y1="${pl.leg.y+12}" y2="${pl.leg.y+12}" stroke="#222" stroke-width="1.5"/><text x="${pl.leg.x+232}" y="${pl.leg.y+16}" font-size="11">District boundary</text>`:'')
  +items.map(i=>`<rect x="${i.x}" y="${i.y}" width="${fs}" height="${fs}" fill="${i.c}" stroke="#333" stroke-width=".8"/><text x="${i.x+fs+6}" y="${i.y+fs-1}" font-size="${fs}">${esc(i.t)}</text>`).join(''):'')+'</svg>';
 return{svg:svgS,pw,ph,wm,hm,s:{title,m,ids,col,tx,ty,kk,labels,items,fs,rh,leg:pl.leg,bk,by}}}
async function pptEdit(r,o){const s=r.s,p=new PptxGenJS(),w=r.wm/25.4,h=r.hm/25.4,I=v=>v/96,hx=c=>hex(c).slice(1).toUpperCase(),F='Arial';
 p.defineLayout({name:'MAP',width:w,height:h});p.layout='MAP';const sl=p.addSlide();
 sl.addText(s.title,{x:0,y:I(s.m),w,h:.45,align:'center',fontSize:24,bold:true,fontFace:F,objectName:'Title'});
 if(o.note)sl.addText(o.note,{x:I(s.m),y:I(s.m+36),w:w-2*I(s.m),h:o.note.split('\n').length*.3,align:'center',valign:'top',fontSize:15,fontFace:F,margin:0,objectName:'Note'});
 const shp=(id,fill,lc,lw,nm)=>{const b=D[id].bb,bx=s.tx+b[0]*s.kk,by=s.ty+b[1]*s.kk,pts=[];
  D[id].p.split(/(?=[MLZ])/).forEach(c=>{if(c[0]==='Z')pts.push({close:true});else if(c.length>1){const[x,y]=c.slice(1).split(',').map(Number),q={x:I(s.tx+x*s.kk-bx),y:I(s.ty+y*s.kk-by)};if(c[0]==='M')q.moveTo=true;pts.push(q)}});
  sl.addShape('custGeom',{x:I(bx),y:I(by),w:Math.max(.01,I((b[2]-b[0])*s.kk)),h:Math.max(.01,I((b[3]-b[1])*s.kk)),fill:{color:fill},line:{color:lc,width:lw},points:pts,objectName:nm})};
 Object.values(s.by).forEach(js=>{if(o.sbw>0)js.forEach(j=>shp(s.ids[j],'000000','000000',o.sbw*1.5,'State border'));js.forEach(j=>shp(s.ids[j],hx(s.col[j]),'222222',o.bw*.75,nameOf(s.ids[j])))});
 s.labels.forEach(l=>{if(l.ln){const[a,b,c,d]=l.ln;sl.addShape('line',{x:I(Math.min(a,c)),y:I(Math.min(b,d)),w:I(Math.abs(c-a)),h:I(Math.abs(d-b)),flipV:(c-a)*(d-b)<0,line:{color:'333333',width:.6}});
  sl.addShape('ellipse',{x:I(a-2.2),y:I(b-2.2),w:I(4.4),h:I(4.4),fill:{color:'111111'},line:{color:'111111',width:.3}})}
  const hh=I(l.lines.length*l.fs*1.3);sl.addText(l.lines.join('\n'),{x:I(l.x)-.8,y:I(l.y)-hh/2,w:1.6,h:hh,align:'center',valign:'middle',fontSize:l.fs*.75,bold:true,margin:0,fontFace:F,objectName:l.nm+' label'})});
 if(s.leg){sl.addText('Colour Code – Districts',{x:I(s.leg.x),y:I(s.leg.y),w:2.4,h:.28,fontSize:11,bold:true,margin:0,fontFace:F});
  if(s.bk){sl.addShape('line',{x:I(s.leg.x+200),y:I(s.leg.y+12),w:I(25),h:0,line:{color:'222222',width:1.2}});sl.addText('District boundary',{x:I(s.leg.x+232),y:I(s.leg.y),w:1.4,h:.28,fontSize:8,margin:0,fontFace:F})}
  s.items.forEach(i=>{sl.addShape('rect',{x:I(i.x),y:I(i.y),w:I(s.fs),h:I(s.fs),fill:{color:hx(i.c)},line:{color:'333333',width:.6}});
   sl.addText(i.t,{x:I(i.x+s.fs+6),y:I(i.y-(s.rh-s.fs)/2),w:2.3,h:I(s.rh),fontSize:s.fs*.75,valign:'middle',margin:0,fontFace:F})})}
 await p.writeFile({fileName:'district-map.pptx'})}
function show(n){['mapw','prev','cust'].forEach((x,i)=>$(x).style.display=i+1===n?(x==='mapw'?'':'block'):'none');[1,2,3].forEach(i=>$('t'+i).classList.toggle('on',i===n));if(n===2)renderPrev();if(n===3)renderCust()}
function renderCust(){const ids=[...S];$('cust').innerHTML=(ids.length?'<button onclick="for(const k in CU)delete CU[k];renderCust();sync()">Reset customisations</button><p class="muted">Change colour or the name shown in map, legend and exports.</p>':'<p class="muted">Select districts first.</p>')
 +ids.map((id,j)=>`<div class="cr"><b>${j+1}</b><input type="color" data-c="${id}" value="${hex(colr(id,j))}"><input data-n="${id}" value="${esc(nameOf(id))}"></div>`).join('')}
$('cust').addEventListener('input',e=>{const t=e.target,k=t.dataset.c!==undefined?'c':'n',id=t.dataset[k];if(id===undefined)return;(CU[id]=CU[id]||{})[k]=t.value;sync()});

const dl=(b,n)=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=n;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),5000)};
const toCanvas=(svgS,pw,ph,sc)=>new Promise((ok,no)=>{const u=URL.createObjectURL(new Blob([svgS],{type:'image/svg+xml'})),im=new Image();
 im.onload=()=>{const c=document.createElement('canvas');c.width=Math.round(pw*sc);c.height=Math.round(ph*sc);const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);ok(c)};
 im.onerror=()=>no(new Error('Render failed (try lower quality)'));im.src=u});
async function doExport(){
 if(!S.size)return alert('Select at least one district first.');const o=opts(),btn=$('go');btn.disabled=true;btn.textContent='Exporting…';
 try{const r=pageSVG(o),c=o.fmt==='pptx'?null:await toCanvas(r.svg,r.pw,r.ph,o.q),name='district-map';o.land=r.pw>r.ph;
  if(o.fmt==='png')c.toBlob(b=>dl(b,name+'.png'));

   pdf.addImage(c.toDataURL('image/jpeg',.95),'JPEG',0,0,pdf.internal.pageSize.getWidth(),pdf.internal.pageSize.getHeight());pdf.save(name+'.pdf')}
  else if(o.fmt==='pptx')await pptEdit(r,o);else if(o.fmt==='pptxi'){const p=new PptxGenJS(),w=r.wm/25.4,h=r.hm/25.4;p.defineLayout({name:'MAP',width:w,height:h});p.layout='MAP';
   p.addSlide().addImage({data:c.toDataURL('image/png'),x:0,y:0,w,h});await p.writeFile({fileName:name+'.pptx'})}
  else{const d=window.docx,b64=c.toDataURL('image/png').split(',')[1],bytes=Uint8Array.from(atob(b64),ch=>ch.charCodeAt(0)),tw=mm=>Math.round(mm/25.4*1440),
   [a,b]=[Math.min(r.wm,r.hm),Math.max(r.wm,r.hm)];
   const doc=new d.Document({sections:[{properties:{page:{size:{width:tw(a),height:tw(b),orientation:o.land?d.PageOrientation.LANDSCAPE:d.PageOrientation.PORTRAIT},margin:{top:0,right:0,bottom:0,left:0}}},
    children:[new d.Paragraph({spacing:{before:0,after:0,line:240},children:[new d.ImageRun({type:'png',data:bytes,transformation:{width:r.pw-4,height:r.ph-14}})]})]}]});
   dl(await d.Packer.toBlob(doc),name+'.docx')}
 }catch(err){alert('Export failed: '+err.message)}
 btn.disabled=false;btn.textContent='Export'}
$('zones').innerHTML=['',...Object.keys(ZONES)].map(z=>`<button data-z="${z}" class="${z?'':'on'}" title="${z?'Show this zone and select/deselect all its districts':'Show all states'}" onclick="zoneClick('${z}')">${z||'All'}</button>`).join('')+'<button onclick="expAll(true)">＋ Expand all</button><button onclick="expAll(false)">－ Collapse all</button>';
